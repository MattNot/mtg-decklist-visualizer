<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Decklist di Mono-R Madness">
  <title>Mono-R Madness | Lega Pauper Cosenza</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --columns: 3; --brick: #a43f38; --ink: #7e332d; --canvas-scale: 1.40625; --header-split: 67.8%; }
    html, body { width: 100%; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    .prova-decklist-1 { width: 768px; height: 1024px; overflow: hidden; transform: scale(var(--canvas-scale)); transform-origin: top left; background: #f8f7f7; color: white; }
    .header-74 { position: relative; height: 292px; overflow: hidden; background: var(--brick); }
    .header-74::after { content: ""; position: absolute; left: 0; right: 0; top: 211px; height: 81px; background: linear-gradient(to right, rgba(91, 31, 28, .4) 0 var(--header-split), rgba(49, 22, 21, .62) var(--header-split) 100%); pointer-events: none; }
    .header-content { position: relative; z-index: 1; height: 211px; padding: 32px 34px 0; }
    .header-thumb { position: absolute; z-index: 0; right: 0; top: 0; width: 32.2%; height: 211px; object-fit: cover; object-position: 62% center; clip-path: polygon(21% 0, 100% 0, 100% 100%, 0 100%); }
    .header-title { position: relative; max-width: 470px; margin: 0 0 2px; font-family: var(--font-family-din-condensed), Impact, sans-serif; font-size: 43px; line-height: .98; letter-spacing: 0; white-space: nowrap; }
    .header-author { margin: 0; font-size: 23px; line-height: 1.15; }
    .header-event { position: absolute; left: 180px; bottom: 20px; max-width: 260px; margin: 0; padding: 0; font-size: 14px; line-height: 1.15; font-weight: 700; }
    .header-logo { position: absolute; left: 34px; bottom: 18px; z-index: 2; width: 126px; height: auto; }
    .header-stats { position: absolute; z-index: 2; left: 34px; right: 34px; bottom: 0; display: grid; grid-template-columns: 5fr 2fr; gap: 0; height: 81px; }
    .deck-stat { padding: 15px 0 0; }
    .deck-stat + .deck-stat { padding-left: 0; }
    .stat-label { margin-bottom: 9px; font: 700 14px/1.1 var(--font-family-helvetica-neue), sans-serif; }
    .type-summary { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .type-count { display: inline-flex; align-items: center; gap: 5px; font-size: 16px; }
    .type-count img { width: 22px; height: 22px; object-fit: contain; }
    .body-2 { display: grid; grid-template-columns: 5fr 2fr; gap: 18px; min-height: 732px; padding: 20px 34px 0; background: #f8f7f7; }
    .card-panel { align-self: start; padding: 12px 10px 16px; border-radius: 3px; }
    .main-deck { background: rgba(164, 63, 56, .08); }
    .sideboard { background: rgba(90, 90, 90, .08); }
    .card-grid { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, var(--card-width, 1fr))); justify-content: space-between; align-content: start; height: 684px; gap: 8px 4px; }
    .sideboard { --columns: 2 !important; }
    .card { position: relative; width: 100%; min-width: 0; aspect-ratio: 63 / 88; overflow: visible; border: 0; border-radius: 4px; box-shadow: 3px 4px 2px rgba(0,0,0,.45); background: linear-gradient(#f1f1f1, #e6e6e6); }
    .card:hover { z-index: 2; transform: translateY(-3px); }
    .card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
    .copies { position: absolute; right: 0; top: 0; display: grid; place-items: center; min-width: 25px; height: 23px; padding: 0 4px; background: #fff; color: var(--ink); font: 700 14px/1 var(--font-family-helvetica-neue), sans-serif; }
    @media (max-width: 600px) { .prova-decklist-1 { min-height: 100vh; } .header-content { padding-left: 22px; padding-right: 22px; } .header-title { font-size: clamp(28px, 5.6vw, 43px); } .header-event { left: 122px; max-width: 210px; font-size: 11px; } .header-logo { left: 22px; width: 88px; } .header-stats { left: 22px; right: 22px; } .body-2 { gap: 10px; padding-left: 22px; padding-right: 22px; } .deck-stat + .deck-stat { padding-left: 12px; } .type-summary { gap: 8px; } }
  </style>
</head>
<body>
  <main class="prova-decklist-1">
    <header class="header-74">
      <img class="header-thumb" src="images/thumbnail.png" alt="">
      <div class="header-content">
        <img class="header-logo" src="images/logo-lpc-letter-white.png" alt="Lega Pauper Cosenza">
        <h1 class="header-title">Mono-R Madness</h1>
        <p class="header-author">Michele Alitto</p>
        <p class="header-event">2° Tappa - Autumn Season 1 | Lega Pauper Cosenza</p>
      </div>
            <div class="header-stats">
                <div class="deck-stat"><div class="stat-label">MAIN DECK / 60 Carte</div><div class="type-summary"><span class="type-count"><img src="../../card_type_symbols/creature.png" alt="">12</span><span class="type-count"><img src="../../card_type_symbols/sorcery.png" alt="">12</span><span class="type-count"><img src="../../card_type_symbols/instant.png" alt="">16</span><span class="type-count"><img src="../../card_type_symbols/land.png" alt="">20</span></div></div>
                <div class="deck-stat"><div class="stat-label">SIDEBOARD / 15 Carte</div><div class="type-summary"><span class="type-count"><img src="../../card_type_symbols/sorcery.png" alt="">3</span><span class="type-count"><img src="../../card_type_symbols/instant.png" alt="">7</span><span class="type-count"><img src="../../card_type_symbols/artifact.png" alt="">5</span></div></div>
            </div>
    </header>
    <div class="body-2">
            <section class="card-panel main-deck" style="--columns:3;--rows:4"><div class="card-grid"><article class="card" title="Guttersnipe - Creature — Goblin Shaman"><img src="../../.card_cache/guttersnipe.jpg" alt="Guttersnipe" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Kessig Flamebreather - Creature — Human Shaman"><img src="../../.card_cache/kessig_flamebreather.jpg" alt="Kessig Flamebreather" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Sneaky Snacker - Creature — Faerie Rogue"><img src="../../.card_cache/sneaky_snacker.jpg" alt="Sneaky Snacker" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Faithless Looting - Sorcery"><img src="../../.card_cache/faithless_looting.jpg" alt="Faithless Looting" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Grab the Prize - Sorcery"><img src="../../.card_cache/grab_the_prize.jpg" alt="Grab the Prize" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Highway Robbery - Sorcery"><img src="../../.card_cache/highway_robbery.jpg" alt="Highway Robbery" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Fiery Temper - Instant"><img src="../../.card_cache/fiery_temper.jpg" alt="Fiery Temper" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Fireblast - Instant"><img src="../../.card_cache/fireblast.jpg" alt="Fireblast" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Lava Dart - Instant"><img src="../../.card_cache/lava_dart.jpg" alt="Lava Dart" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Lightning Bolt - Instant"><img src="../../.card_cache/lightning_bolt.jpg" alt="Lightning Bolt" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Mountain - Basic Land — Mountain"><img src="../../.card_cache/mountain.jpg" alt="Mountain" loading="lazy"><span class="copies">x20</span></article></div></section>
            <section class="card-panel sideboard" style="--columns:2;--rows:3"><div class="card-grid"><article class="card" title="End the Festivities - Sorcery"><img src="../../.card_cache/end_the_festivities.jpg" alt="End the Festivities" loading="lazy"><span class="copies">x3</span></article>
<article class="card" title="Breath Weapon - Instant"><img src="../../.card_cache/breath_weapon.jpg" alt="Breath Weapon" loading="lazy"></article>
<article class="card" title="Pyroblast - Instant"><img src="../../.card_cache/pyroblast.jpg" alt="Pyroblast" loading="lazy"><span class="copies">x4</span></article>
<article class="card" title="Red Elemental Blast - Instant"><img src="../../.card_cache/red_elemental_blast.jpg" alt="Red Elemental Blast" loading="lazy"><span class="copies">x2</span></article>
<article class="card" title="Campfire - Artifact"><img src="../../.card_cache/campfire.jpg" alt="Campfire" loading="lazy"><span class="copies">x2</span></article>
<article class="card" title="Relic of Progenitus - Artifact"><img src="../../.card_cache/relic_of_progenitus.jpg" alt="Relic of Progenitus" loading="lazy"><span class="copies">x3</span></article></div></section>
    </div>
  </main>
</body>
<script>
    (() => {
        const canvas = document.querySelector('.prova-decklist-1');
        const baseWidth = 768;
        const baseHeight = 1024;
        const exportScale = 1.40625;
        const fitCards = () => {
            const canvasRect = canvas.getBoundingClientRect();
            const scale = canvasRect.width / canvas.offsetWidth;
            document.querySelectorAll('.card-panel').forEach((panel) => {
                const grid = panel.querySelector('.card-grid');
                const columns = Number.parseInt(getComputedStyle(panel).getPropertyValue('--columns'), 10);
                const cards = grid.querySelectorAll('.card').length;
                if (!grid || !columns || !cards) return;
                const rows = Math.ceil(cards / columns);
                const gridRect = grid.getBoundingClientRect();
                const styles = getComputedStyle(grid);
                const columnGap = parseFloat(styles.columnGap) * scale;
                const rowGap = parseFloat(styles.rowGap) * scale;
                const availableWidth = gridRect.width / scale;
                const availableHeight = (canvasRect.bottom - gridRect.top) / scale;
                const widthByColumns = (availableWidth - columnGap * (columns - 1)) / columns;
                const widthByRows = ((availableHeight - rowGap * (rows - 1)) / rows) * 63 / 88;
                grid.style.setProperty('--card-width', `${Math.max(0, Math.min(widthByColumns, widthByRows))}px`);
            });
        };
        const resizeCanvas = () => {
            const scale = Math.min(exportScale, window.innerWidth / baseWidth);
            canvas.style.setProperty('--canvas-scale', scale);
            document.body.style.width = `${baseWidth * scale}px`;
            document.body.style.height = `${baseHeight * scale}px`;
            fitCards();
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
    })();
</script>
</html>
